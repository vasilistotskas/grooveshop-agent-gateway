name: Release

# Tag-driven releases: pushing vX.Y.Z runs the full test suite, publishes
# the container image and creates the GitHub Release in ONE workflow —
# a `release: published` trigger would never fire for a release created
# with GITHUB_TOKEN, so everything stays in-pipeline instead.
on:
  push:
    tags: ['v*.*.*']

# Read-only by default; each job that publishes gets exactly the write
# scope it needs, so the test job (third-party actions, test code) never
# holds a token that can push images or create releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
      # The same three checks as CI's lint job: a release is not
      # published with a vulnerability known since main's last run.
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: The image's Go is go.mod's
        run: |
          want="$(go list -m -f "{{.GoVersion}}")"
          grep -qx "FROM golang:${want}-alpine AS build" Dockerfile
      - name: Known vulnerabilities
        run: go tool govulncheck ./...
      - name: Unit tests (race)
        run: go test -race ./internal/...
      - name: Integration tests (testcontainers)
        run: go test -race -tags integration -timeout 10m ./internal/integration/...

  real-stack:
    uses: ./.github/workflows/real-stack.yml

  publish:
    runs-on: ubuntu-latest
    needs: [test, real-stack]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the registry the infra image pins reference
      # (gro0ve/grooveshop-agent-gateway). Requires the DOCKER_USERNAME /
      # DOCKER_PASSWORD repo secrets — same names as the sibling repos.
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            gro0ve/grooveshop-agent-gateway
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      # cache-from only: main's CI writes this cache, which a release tag
      # may read. Nothing exports from here: GitHub never lets one tag
      # restore another tag's cache, so a tag's export was never read.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

  release:
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
