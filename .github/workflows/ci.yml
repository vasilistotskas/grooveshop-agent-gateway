name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        run: go test -race -coverprofile=coverage.out ./internal/...
      - name: Integration tests (testcontainers)
        run: go test -race -tags integration -timeout 10m ./internal/integration/...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/gateway
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t agent-gateway:ci .
