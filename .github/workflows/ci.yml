name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# lint, test and build are independent smoke checks, so they all run in
# parallel — build used to need [lint, test], which only added its ~2 min
# to the critical path without protecting anything (nothing is published
# here; release.yml re-runs the full suite on tags).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        run: go test -race -coverprofile=coverage.out ./internal/...
      - name: Integration tests (testcontainers)
        run: go test -race -tags integration -timeout 10m ./internal/integration/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/gateway
      # Buildx with the GHA cache backend instead of plain `docker build`:
      # the Dockerfile's cache mounts are empty on a fresh runner, so the
      # cached layers are the only thing saving the in-image Go rebuild.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (smoke check, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: agent-gateway:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
