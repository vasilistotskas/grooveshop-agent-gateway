name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# lint, test and build are independent smoke checks, so they all run in
# parallel — build used to need [lint, test], which only added its ~2 min
# to the critical path without protecting anything (nothing is published
# here; release.yml re-runs the full suite on tags).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
      # go.mod and go.sum hold exactly what the code imports.
      - name: go.mod is tidy
        run: go mod tidy -diff
      # The version is go.mod's (a tool directive), so Dependabot moves
      # it. It fails on a known vulnerability the code can reach, in a
      # dependency or in the Go release go.mod names.
      - name: Known vulnerabilities
        run: go tool govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests (race)
        run: go test -race ./internal/...
      - name: Integration tests (testcontainers)
        run: go test -race -tags integration -timeout 10m ./internal/integration/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd/gateway
      # Buildx with the GHA cache backend instead of plain `docker build`:
      # the Dockerfile's cache mounts are empty on a fresh runner, so the
      # cached layers are the only thing saving the in-image Go rebuild.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (smoke check, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: agent-gateway:ci
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
