version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
    open-pull-requests-limit: 10

  # Version updates only (security updates are neither grouped nor
  # delayed by these settings): minor and patch action bumps arrive
  # together, a major arrives on its own to be checked against these
  # workflows, and a release ages a week before it is proposed. "ci"
  # cuts no release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
