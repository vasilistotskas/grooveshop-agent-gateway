version: "2"

run:
  timeout: 5m
  build-tags:
    - integration
    # The feed memory measurement (internal/feeds/memory_measure_test.go)
    # runs by hand; linting it keeps it compiling against the code.
    - feedmem

linters:
  default: standard
  enable:
    - bodyclose
    # The Django client's whole error design is sentinel unwrapping via
    # errors.Is/As; a bare == or type switch on an error silently breaks it.
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    # A log call that has a context must pass it: the logger's context
    # handler takes the request id and tenant from it.
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  exclusions:
    rules:
      # Tests use the http.Get/httptest.NewRequest shorthands and helpers
      # that close bodies out of the linter's sight.
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
  settings:
    sloglint:
      context: scope
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vasilistotskas/grooveshop-agent-gateway
